name: bridge-audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiments:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Metric to triad-Hodge bridge
        run: python experiments/exp01_metric_triad.py
      - name: Noncommuting-strain holonomy
        run: python experiments/exp02_holonomy.py
      - name: Helicity conversion and signed edge-work adversary
        run: python experiments/exp03_helicity_edge_work.py
      - name: Material flux triple reproduces signed edge work
        run: python experiments/exp04_material_flux_triple.py
      - name: Localized material-flux PDE ledger
        run: python experiments/exp05_localized_flux_pde.py
      - name: Moving-cut time-face calibration
        run: python experiments/exp06_moving_cut_time_face.py
      - name: Kelvin loop realization of interaction phase
        run: python experiments/exp07_kelvin_loop_triple.py
      - name: Physical phase-velocity PDE ledger
        run: python experiments/exp08_phase_velocity_pde.py
      - name: Local phase-work trichotomy stress
        run: python experiments/exp09_phase_work_trichotomy.py
      - name: Exterior-algebra common deformation cancellation
        run: python experiments/exp10_exterior_common_deformation.py
      - name: Literal localization owner calculus
        run: python experiments/exp11_literal_owner_calculus.py
      - name: Current-upstream cyclic and Cauchy closures
        run: python experiments/exp12_current_head_closures.py
      - name: Event readout, state-map clock residual, and replica phase cancellation
        run: python experiments/exp13_event_clock_replica.py
      - name: Kernel selector purity and cubic-resolution transfer
        run: python experiments/exp14_kernel_cubic_resolution.py
      - name: Cauchy exterior-volume and covariance-phase separation
        run: python experiments/exp15_cauchy_exterior_volume.py
      - name: Full Cauchy payoff and selected-event factorization
        run: python experiments/exp16_full_cauchy_payoff_factorization.py
      - name: Vorticity transpose gauge and Cauchy onset hierarchy
        run: python experiments/exp17_transpose_mixed_onset.py
