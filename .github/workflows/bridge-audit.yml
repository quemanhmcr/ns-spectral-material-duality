    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Metric to triad-Hodge bridge
        run: python experiments/exp01_metric_triad.py
      - name: Noncommuting-strain holonomy
        run: python experiments/exp02_holonomy.py
      - name: Helicity conversion and signed edge-work adversary
        run: python experiments/exp03_helicity_edge_work.py
